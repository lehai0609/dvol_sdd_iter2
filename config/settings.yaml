api:
  base_url: https://api.cryptodatadownload.com/v1
  timeout_s: 30
  max_retries: 3
  backoff_factor: 0.8

endpoints:
  dvol: /data/ohlc/deribit/volatility
  options: /data/summary/deribit/options/greeks/maturities/
  futures: /data/ohlc/deribit/futures/
  funding: /data/ohlc/deribit/futures/funding/
  onchain: /data/summary/blockchain/blocks/

storage:
  root: ./data
  compression: zstd
